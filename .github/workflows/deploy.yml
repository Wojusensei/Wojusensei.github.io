name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每 6 小时重建一次：刷新构建时抓取的数据（友链头像等 GitHub 数据）
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          # Astro 7 要求 Node >= 22.12
          node-version: 22
        env:
          # 构建时抓取 GitHub 数据（star / commit / PR 统计）；令牌只存在于此，不进入前端
          # （GitHub 禁止 Secret 名以 GITHUB_ 开头，故仓库名为 GH_DATA_TOKEN，这里映射回代码读取的变量名）
          GITHUB_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
